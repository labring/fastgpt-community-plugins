name: Validate Community Plugins

on:
  pull_request:
    paths:
      - "plugins.json"
      - ".gitmodules"
      - "plugins/**"
      - "reviews/**"
      - "events/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".agents/skills/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "vitest.config.ts"
      - "tsconfig.json"
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base SHA for changed-plugin detection"
        required: false
      head_sha:
        description: "Head SHA for changed-plugin detection"
        required: false

permissions:
  contents: read

concurrency:
  group: validate-community-plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm test

      - name: Validate registry
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || 'HEAD' }}
        run: |
          pnpm run validate -- --base "$BASE_SHA" --head "$HEAD_SHA"
